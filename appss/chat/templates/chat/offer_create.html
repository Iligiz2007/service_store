{% extends "index.html" %}
{% block title %}Создание задачи{% endblock title %}
{% block content %}

<div class="card bg-dark border-secondary text-light">
    <div class="card-body"> 
            
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label text-white">Описание</label>
                    <textarea name="message" class="form-control" rows="4" placeholder="Напишите, как вы будете решать задачу клиента"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Стоимость</label>
                    <input type="number" name="proposed_price" min="0" class="form-control" placeholder="Примерная стоимость работы">

                </div>
                <button type="submit" class="btn btn-primary mt-2">Создать</button>
            </form>

        </div>

    </div>

{% endblock content %}
