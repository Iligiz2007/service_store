{% extends "index.html" %}

{% block title %}Список задач{% endblock title %}

{% block content %}
    <div class="container pt-5">
        <div class="row">
            {% for serv in service %}
                <div class="col-md-4 col-sm-6 col-12 mb-4">
                    <div class="text-light card bg-dark border-secondary h-100" style="width: 18rem;">
                        <div class="card-body d-flex flex-column">
                            <h5 class="card-title">{{ serv.title }}</h5>
                            <p class="card-text flex-grow-1">
                                {{ serv.description|truncatechars:100 }}
                                {% if serv.description|length > 100 %}
                                    <a href="{% url 'shop:detail_service' serv.pk %}" class="text-info">...читать далее</a>
                                {% endif %}
                            </p>
                            <a href="{% url 'shop:update_service' slug=serv.slug %}" class="btn btn-warning mt-auto">Редактирвать</a>
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock content %}
