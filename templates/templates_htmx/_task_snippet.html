<div class="container border border-white p-0 overflow-auto" style="height: 200px;">
    {% for tk in task %}
       
        <div class="d-flex justify-content-between align-items-center bg-dark text-light border-secondary p-3 mb-2 rounded-3">
            
           
            <h5 class="mb-0 me-3">{{ tk.title|truncatechars:30}}</h5>
            
           
            <div class="btn-group">
                <a href="{% url 'shop:detail_task' slug=tk.slug %}" class="btn btn-light btn-sm">🔍</a>
                <a href="{% url 'list_offers_task' task_slug=tk.slug %}" class="btn btn-primary btn-sm">✉</a>
                <a href="{% url 'shop:update_task' slug=tk.slug %}" class="btn btn-warning btn-sm">🛠</a>
            </div>
        
        </div>

    {% endfor %}
</div>
