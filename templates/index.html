{% load static %}
<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}index{% endblock title %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head> 
<body class="bg-dark text-light pt-3 p-2" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>

    <div style="position: fixed; top: 10px; right: 10px; z-index: 9999;">
            
            {% if not user.is_authenticated %}
               
                <div hx-get="{% url 'menu_guest' %}" 
                     hx-trigger="load" 
                     hx-swap="innerHTML">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Загрузка...</span>
                        </div>
                    </div>
                </div>
            {% else %}
                <!-- Тут нужно будет добавить 2 меню для продавца и покупателя -->
                <div hx-get="{% url 'menu_user' %}" 
                     hx-trigger="load" 
                     hx-swap="innerHTML">
                    <div class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Загрузка меню...</span>
                        </div>
                    </div>
                </div>
            {% endif %}
            
        
        
    </div>

 
<div style="height: 70px;"></div>
    {% block content %}
    <h1 class="text-light mt-4">Главная</h1>
    <div style="background-image: url('{% static 'images/background-stripes-aside-tear-2.png' %}');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            min-height: 200px;"> 
</div>
    {% endblock content %}

    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
