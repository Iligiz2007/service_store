<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}index{% endblock title %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head> 
<body class="bg-dark text-light top-80" >
       <div class="container-fluid mt-3 position-relative">
   
    
    <div class="position-absolute top-0 end-0 m-1">
        {% if not user.is_authenticated %}
            <div class="btn-group">
                <a href="{% url 'register' %}" class="btn btn-outline-primary"  >Регистрация</a>
                <a href="{% url 'login' %}" class="btn btn-outline-primary">Войти</a>
            </div>
        {% else %}
            <div class="btn-group" role="group">
                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-outline-primary rounded-end-0">Выход</button>
                </form>
                <a href="{% url 'form_servace_name' %}" class="btn btn-outline-primary">Создать задачу</a>
                <a href="{% url 'list_service' %}" class="btn btn-outline-primary">Список доступных задач</a>
                <a href="{% url 'detail_user' slug=user.profile.slug %}" class="btn btn-outline-primary">Профиль</a>
            </div>
        {% endif %}
    </div>
</div>
<br>
<br>

    {% block content %}
  <h1 class="text-light mt-4">Главная</h1>
    {% endblock content %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
