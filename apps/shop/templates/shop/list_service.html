{% extends "index.html" %}

{% block title %}Список задач{% endblock title %}

{% block content %}
    {% for serv in service %}
        <strong>
            <a href="{% url 'detail_service' serv.pk %}">{{ serv.title }}</a>
        </strong>
        <p>{{ serv.description }}</p>
        <p>{{ serv.price }}р</p>
        <p>Заказчик: {{ serv.user.username }}</p>
        <hr>
    {% endfor %}
{% endblock content %}
